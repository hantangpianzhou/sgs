<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三国杀图片画廊 · 归一版</title>
<style>
  :root{--bg:#0f1115;--panel:#1a1d24;--txt:#e6e6e6;--accent:#c0392b;--muted:#9aa0a6}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Microsoft YaHei",sans-serif}
  header{padding:14px 18px;background:var(--panel);position:sticky;top:0;z-index:10;border-bottom:1px solid #2a2e36}
  h1{font-size:18px;margin:0 0 8px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;overflow-y:auto;max-height:104px;padding:4px 0}
  .tabs::-webkit-scrollbar{width:6px}
  .tabs::-webkit-scrollbar-thumb{background:#333a44;border-radius:3px}
  .tab{background:#262b33;color:var(--txt);border:1px solid #333a44;padding:5px 11px;border-radius:16px;cursor:pointer;font-size:13px;flex:0 0 auto;white-space:nowrap;text-decoration:none;display:inline-block}
  .tab:hover{border-color:var(--accent)}
  .tab.active{background:var(--accent);border-color:var(--accent)}
  .tab .c{color:var(--muted);font-size:11px;margin-left:5px}
  .tab.active .c{color:#fff}
  input.search,input.fsearch{flex:1;min-width:160px;background:#0c0e12;border:1px solid #333a44;color:var(--txt);padding:7px 11px;border-radius:8px;font-size:13px}
  .meta{font-size:12px;color:var(--muted);margin:8px 0 0}
  #sections{padding:6px 0 40px}
  .fsec{scroll-margin-top:175px;padding:0 14px}
  .fhead{font-size:15px;margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid #2a2e36;position:sticky;top:170px;background:var(--bg);z-index:5}
  .fhead .c{color:var(--muted);font-size:12px;margin-left:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .card{background:var(--panel);border-radius:8px;overflow:hidden;cursor:pointer;border:1px solid #262b33;transition:transform .1s}
  .card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .card img{width:100%;height:170px;object-fit:cover;display:block;background:#000}
  .card .name{font-size:11px;padding:6px 7px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:50;flex-direction:column}
  .lb.show{display:flex}
  .lb img{max-width:94vw;max-height:84vh;object-fit:contain}
  .lb .cap{color:#ddd;font-size:13px;margin-top:10px;max-width:90vw;text-align:center;word-break:break-all}
  .lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;color:#fff;cursor:pointer;user-select:none;padding:10px 16px;opacity:.7}
  .lb .nav:hover{opacity:1}
  .lb .prev{left:0}.lb .next{right:0}
  .lb .close{position:absolute;top:14px;right:20px;font-size:30px;color:#fff;cursor:pointer}
  .empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>三国杀图片画廊 <span style="color:var(--muted);font-size:13px">· 归一版 (PNG + 动画GIF) · 共 6540 张</span></h1>
  <div class="bar">
    <input class="search" id="search" placeholder="搜索图片名（全局，跨文件夹）…">
    <input class="fsearch" id="fsearch" placeholder="筛选标签/文件夹（输入即过滤）…">
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="meta" id="meta"></div>
</header>
<div id="sections"></div>
<div class="lb" id="lb">
  <span class="close" id="lbClose">&times;</span>
  <span class="nav prev" id="lbPrev">&#8249;</span>
  <img id="lbImg" src="">
  <span class="nav next" id="lbNext">&#8250;</span>
  <div class="cap" id="lbCap"></div>
</div>

  metaEl.textContent='全局展示 · 共 '+TOTAL+' 张 · 筛选后可见 '+visibleList.length+' 张'
    +(q?'（搜索："'+q+'"）':'')+(fq?'（标签："'+fq+'"）':'');
  onScroll();
}
const headerEl=document.querySelector('header');
let currentActive=-1;
let SECS=[];
function setActiveTab(idx){
  if(idx===currentActive)return;
  currentActive=idx;
  tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  let tab = idx<0 ? tabsEl.querySelector('.tab') : tabsEl.querySelector('.tab[data-idx="'+idx+'"]');
  if(tab){tab.classList.add('active');syncTabScroll(tab);}
}
function syncTabScroll(tab){
  const tr=tabsEl.getBoundingClientRect();
  const er=tab.getBoundingClientRect();
  if(er.top<tr.top) tabsEl.scrollTop-=(tr.top-er.top+4);
  else if(er.bottom>tr.bottom) tabsEl.scrollTop+=(er.bottom-tr.bottom+4);
}
function onScroll(){
  if(!SECS.length) SECS=[...sectionsEl.querySelectorAll('.fsec')];
  const hb=headerEl.getBoundingClientRect().bottom;
  let idx=-1;
  for(let k=0;k<SECS.length;k++){
    const sec=SECS[k];
    if(sec.style.display==='none')continue;
    if(sec.getBoundingClientRect().top<=hb+4) idx=parseInt(sec.id.split('-')[1]);
    else break;
  }
  setActiveTab(idx);
}
tabsEl.addEventListener('click',e=>{
  const a=e.target.closest('.tab');
  if(!a)return;
  const idx=a.dataset.idx!==undefined?parseInt(a.dataset.idx):-1;
  setActiveTab(idx);
});
window.addEventListener('scroll',onScroll,{passive:true});
const lb=document.getElementById('lb');
const lbImg=document.getElementById('lbImg');
const lbCap=document.getElementById('lbCap');
function openLb(i){lb.dataset.i=i;showLb(i);lb.classList.add('show');}
function showLb(i){const rel=visibleList[i];lb.dataset.i=i;lbImg.src=encodeURI(rel);lbCap.textContent=rel;}
function step(d){let i=parseInt(lb.dataset.i)+d;if(i<0)i=visibleList.length-1;if(i>=visibleList.length)i=0;showLb(i);}
document.getElementById('lbClose').onclick=()=>lb.classList.remove('show');
document.getElementById('lbPrev').onclick=()=>step(-1);
document.getElementById('lbNext').onclick=()=>step(1);
lb.onclick=e=>{if(e.target===lb)lb.classList.remove('show');};
document.addEventListener('keydown',e=>{
  if(!lb.classList.contains('show'))return;
  if(e.key==='Escape')lb.classList.remove('show');
  if(e.key==='ArrowLeft')step(-1);
  if(e.key==='ArrowRight')step(1);
});
sectionsEl.addEventListener('click',e=>{
  const card=e.target.closest('.card');
  if(!card)return;
  const rel=card.getAttribute('data-rel');
  const i=visibleList.indexOf(rel);
  if(i>=0)openLb(i);
});
searchEl.addEventListener('input',applyFilter);
fsearchEl.addEventListener('input',applyFilter);
buildTabs();
buildSections();
applyFilter();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>未分类图片标签预览</title>
<style>
  :root{--bg:#0f1115;--panel:#1a1d24;--txt:#e6e6e6;--accent:#c0392b;--muted:#9aa0a6;--ok:#27ae60;--warn:#f39c12;--dup:#8e44ad;--border:#333a44}
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Microsoft YaHei",sans-serif}
  header{padding:14px 18px;background:var(--panel);position:sticky;top:0;z-index:10;border-bottom:1px solid #2a2e36}
  h1{font-size:18px;margin:0 0 8px}
  h1 .sub{color:var(--muted);font-size:13px;font-weight:normal}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  input.search{flex:1;min-width:180px;background:#0c0e12;border:1px solid var(--border);color:var(--txt);padding:7px 11px;border-radius:8px;font-size:13px}
  select{background:#0c0e12;border:1px solid var(--border);color:var(--txt);padding:7px 9px;border-radius:8px;font-size:13px}
  button{background:#262b33;color:var(--txt);border:1px solid var(--border);padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent)}
  .meta{font-size:12px;color:var(--muted);margin:8px 0 0}
  .meta b{color:var(--txt)}
  #sections{padding:6px 0 40px}
  .fsec{scroll-margin-top:150px;padding:0 14px}
  .fhead{font-size:15px;margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid #2a2e36;position:sticky;top:150px;background:var(--bg);z-index:5}
  .fhead .c{color:var(--muted);font-size:12px;margin-left:6px}
  .badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;margin-left:6px;vertical-align:1px}
  .badge.ai{background:#4a3208;color:var(--warn);border:1px solid var(--warn)}
  .badge.dup{background:#2d1b3d;color:#c39bd3;border:1px solid var(--dup)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
  .card{background:var(--panel);border-radius:8px;overflow:hidden;border:1px solid #262b33;display:flex;flex-direction:column}
  .card:hover{border-color:var(--accent)}
  .card .thumb{position:relative;cursor:pointer}
  .card img{width:100%;height:200px;object-fit:cover;display:block;background:#000}
  .card .tag{position:absolute;top:6px;left:6px;font-size:11px;padding:1px 7px;border-radius:10px}
  .tag.ai{background:rgba(74,50,8,.92);color:var(--warn);border:1px solid var(--warn)}
  .tag.dup{background:rgba(45,27,61,.92);color:#c39bd3;border:1px solid var(--dup)}
  .card .name{font-size:11px;padding:6px 7px 2px;color:var(--muted);word-break:break-all;line-height:1.5}
  .card .info{font-size:11px;padding:0 7px;color:#7a8087}
  .card .ops{padding:6px 7px 8px;margin-top:auto}
  .card input.owner{width:100%;background:#0c0e12;border:1px solid var(--border);color:var(--txt);padding:5px 7px;border-radius:6px;font-size:12px;margin-bottom:5px}
  .card input.owner:focus{border-color:var(--accent);outline:none}
  .card select.act{width:100%;background:#0c0e12;border:1px solid var(--border);color:var(--txt);padding:5px 7px;border-radius:6px;font-size:12px}
  .card.done{border-color:var(--ok)}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;z-index:50;flex-direction:column}
  .lb.show{display:flex}
  .lb img{max-width:94vw;max-height:82vh;object-fit:contain}
  .lb .cap{color:#ddd;font-size:13px;margin-top:10px;max-width:90vw;text-align:center;word-break:break-all}
  .lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;color:#fff;cursor:pointer;user-select:none;padding:10px 16px;opacity:.7}
  .lb .nav:hover{opacity:1}
  .lb .prev{left:0}.lb .next{right:0}
  .lb .close{position:absolute;top:14px;right:20px;font-size:30px;color:#fff;cursor:pointer}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:60}
  .modal.show{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;width:min(860px,92vw);max-height:86vh;display:flex;flex-direction:column;gap:10px}
  .modal h3{margin:0;font-size:15px}
  .modal textarea{width:100%;height:200px;background:#0c0e12;border:1px solid var(--border);color:#c8d0d8;font-family:Consolas,monospace;font-size:12px;padding:8px;border-radius:8px;resize:vertical}
  .modal .row{display:flex;gap:8px;flex-wrap:wrap}
  .empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>未分类图片标签预览 <span class="sub" id="subTitle"></span></h1>
  <div class="bar">
    <input class="search" id="search" placeholder="搜索文件名…">
    <select id="ffilter">
      <option value="all">全部状态</option>
      <option value="unmarked">未标记</option>
      <option value="marked">已标记</option>
      <option value="ai">AI 标注</option>
      <option value="dup">疑似同图</option>
    </select>
    <button class="primary" id="exportBtn">导出标记结果</button>
    <button id="clearBtn">清空标记</button>
  </div>
  <div class="meta" id="meta"></div>
</header>
<div id="sections"></div>
<div class="lb" id="lb">
  <span class="close" id="lbClose">&times;</span>
  <span class="nav prev" id="lbPrev">&#8249;</span>
  <img id="lbImg" src="">
  <span class="nav next" id="lbNext">&#8250;</span>
  <div class="cap" id="lbCap"></div>
</div>
<div class="modal" id="modal">
  <div class="box">
    <h3>标记结果导出</h3>
    <div class="row">
      <button class="primary" id="copyJson">复制 JSON（供归位脚本）</button>
      <button id="copyList">复制人读清单</button>
      <button id="dlJson">下载 JSON</button>
      <button id="mClose" style="margin-left:auto">关闭</button>
    </div>
    <textarea id="taJson" readonly spellcheck="false"></textarea>
    <textarea id="taList" readonly spellcheck="false"></textarea>
  </div>
</div>

const LSKEY = 'unclassified_tags_v1';
let tags = {};
try{ tags = JSON.parse(localStorage.getItem(LSKEY)||'{}'); }catch(e){ tags = {}; }
const groups = [];
const gmap = {};
DATA.forEach((it)=>{
  const k = it.d+'|'+it.t;
  if(gmap[k]===undefined){ gmap[k] = groups.length; groups.push({key:k, d:it.d, t:it.t, items:[]}); }
  const g = groups[gmap[k]];
  g.items.push(it);
});
const sectionsEl = document.getElementById('sections');
const metaEl = document.getElementById('meta');
const subTitle = document.getElementById('subTitle');
const searchEl = document.getElementById('search');
const ffilterEl = document.getElementById('ffilter');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function src(it){ return '未分类/' + encodeURIComponent(it.f); }
function getState(it){
  const t = tags[it.f]||{};
  const owner = (t.owner||'').trim();
  const act = t.act||'待定';
  const marked = owner.length>0 || act!=='待定';
  return {owner, act, marked};
}
function isAiMarked(it){ return it.ai; }
function isDup(it){ return !!it.dup; }
function buildSections(){
  let html='';
  groups.forEach((g,gi)=>{
    html+='<section class="fsec" data-g="'+gi+'">';
    html+='<h2 class="fhead">'+esc(g.d)+' '+esc(g.t);
    const aiN = g.items.filter(isAiMarked).length;
    const dupN = g.items.filter(isDup).length;
    if(aiN) html+='<span class="badge ai">AI ×'+aiN+'</span>';
    if(dupN) html+='<span class="badge dup">同图 ×'+dupN+'</span>';
    html+='<span class="c">'+g.items.length+' 张</span></h2>';
    html+='<div class="grid">';
    g.items.forEach(it=>{
      html+='<div class="card" data-f="'+esc(it.f)+'">';
      html+='<div class="thumb"><img loading="lazy" src="'+src(it)+'" alt="'+esc(it.f)+'">';
      if(it.ai) html+='<span class="tag ai">AI</span>';
      if(it.dup) html+='<span class="tag dup" title="与 '+esc(it.dup)+' MD5 相同">同图</span>';
      html+='</div>';
      html+='<div class="name">'+esc(it.f)+'</div>';
      html+='<div class="info">'+it.w+'×'+it.h+' · '+(it.s/1024).toFixed(0)+' KB</div>';
      html+='<div class="ops"><input class="owner" placeholder="归属武将（可留空）"><select class="act">';
      html+='<option>待定</option><option>留档</option><option>剔除</option><option>同图重复</option>';
      html+='</select></div></div>';
    });
    html+='</div></section>';
  });
  sectionsEl.innerHTML=html;
  sectionsEl.querySelectorAll('.card').forEach(card=>{
    const f = card.dataset.f;
    const it = DATA.find(x=>x.f===f);
    const st = getState(it);
    const inp = card.querySelector('.owner');
    const sel = card.querySelector('.act');
    inp.value = st.owner; sel.value = st.act;
    const sync=()=>{ tags[f]={owner:inp.value, act:sel.value}; localStorage.setItem(LSKEY, JSON.stringify(tags)); refreshCard(card); updateMeta(); };
    inp.addEventListener('input',sync);
    sel.addEventListener('change',sync);
    refreshCard(card);
  });
  sectionsEl.querySelectorAll('.thumb').forEach(th=>{
    th.addEventListener('click',()=>{
      const f = th.parentElement.dataset.f;
      const i = visibleList.indexOf(f);
      if(i>=0) openLb(i);
    });
  });
}
function refreshCard(card){
  const f = card.dataset.f;
  const it = DATA.find(x=>x.f===f);
  const st = getState(it);
  card.classList.toggle('done', st.marked);
}
let visibleList = [];
function applyFilter(){
  const q = searchEl.value.trim().toLowerCase();
  const mode = ffilterEl.value;
  visibleList=[];
  sectionsEl.querySelectorAll('.fsec').forEach(sec=>{
    let secVisible=0;
    sec.querySelectorAll('.card').forEach(card=>{
      const f = card.dataset.f;
      const it = DATA.find(x=>x.f===f);
      const st = getState(it);
      const mQ = !q || f.toLowerCase().includes(q);
      let mMode = true;
      if(mode==='unmarked') mMode = !st.marked;
      else if(mode==='marked') mMode = st.marked;
      else if(mode==='ai') mMode = isAiMarked(it);
      else if(mode==='dup') mMode = isDup(it);
      const m = mQ && mMode;
      card.style.display = m?'':'none';
      if(m){ visibleList.push(f); secVisible++; }
    });
    sec.style.display = secVisible>0?'':'none';
  });
  updateMeta();
}
function updateMeta(){
  const total = DATA.length;
  let marked=0, aiN=0, dupN=0;
  DATA.forEach(it=>{
    const st = getState(it);
    if(st.marked) marked++;
    if(isAiMarked(it)) aiN++;
    if(isDup(it)) dupN++;
  });
  subTitle.textContent = '· 共 '+total+' 张 · '+groups.length+' 帖';
  metaEl.innerHTML = '已标记 <b>'+marked+'</b> / '+total+' · AI 标注 '+aiN+' 张 · 疑似同图 '+dupN+' 张'
    +' · 当前可见 '+visibleList.length+' 张';
}
/* lightbox */
const lb=document.getElementById('lb');
const lbImg=document.getElementById('lbImg');
const lbCap=document.getElementById('lbCap');
function openLb(i){ lb.dataset.i=i; showLb(i); lb.classList.add('show'); }
function showLb(i){ const f=visibleList[i]; lb.dataset.i=i; lbImg.src='未分类/'+encodeURIComponent(f); lbCap.textContent=f; }
function step(d){ let i=parseInt(lb.dataset.i)+d; if(i<0)i=visibleList.length-1; if(i>=visibleList.length)i=0; showLb(i); }
document.getElementById('lbClose').onclick=()=>lb.classList.remove('show');
document.getElementById('lbPrev').onclick=()=>step(-1);
document.getElementById('lbNext').onclick=()=>step(1);
lb.onclick=e=>{ if(e.target===lb) lb.classList.remove('show'); };
document.addEventListener('keydown',e=>{
  if(lb.classList.contains('show')){
    if(e.key==='Escape') lb.classList.remove('show');
    if(e.key==='ArrowLeft') step(-1);
    if(e.key==='ArrowRight') step(1);
  } else if(modal.classList.contains('show')){
    if(e.key==='Escape') modal.classList.remove('show');
  }
});
/* export */
const modal=document.getElementById('modal');
const taJson=document.getElementById('taJson');
const taList=document.getElementById('taList');
function buildExport(){
  const items = DATA.map(it=>{
    const st = getState(it);
    const action = st.owner ? '归位' : st.act;
    return {file:'未分类/'+it.f, date:it.d, title:it.t, floor:it.fl, idx:it.k||'', size:it.s, dim:it.w+'x'+it.h, ai:!!it.ai, dup:it.dup||'', owner:st.owner||'', action:action};
  });
  const json = JSON.stringify({generated:new Date().toLocaleString('zh-CN'), total:items.length, items:items}, null, 2);
  const lines = [];
  const byOwner = {};
  items.forEach(x=>{ if(x.owner){ (byOwner[x.owner]=byOwner[x.owner]||[]).push(x); } });
  if(Object.keys(byOwner).length){
    lines.push('== 归位候选（按武将） ==');
    Object.keys(byOwner).sort().forEach(o=>{
      lines.push('['+o+']');
      byOwner[o].forEach(x=>lines.push('  '+x.file));
    });
    lines.push('');
  }
  const acts = {'留档':[], '剔除':[], '同图重复':[], '待定':[]};
  items.forEach(x=>{ if(!x.owner){ (acts[x.action]||acts['待定']).push(x); } });
  lines.push('== 处置分类 ==');
  ['剔除','同图重复','留档','待定'].forEach(a=>{
    if(acts[a].length){ lines.push('['+a+'] '+acts[a].length+' 张'); acts[a].forEach(x=>lines.push('  '+x.file)); lines.push(''); }
  });
  const aiItems = items.filter(x=>x.ai);
  if(aiItems.length){ lines.push('== AI 标注（' + aiItems.length + ' 张） =='); aiItems.forEach(x=>lines.push('  '+x.file)); }
  return {json, list:lines.join('\n')};
}
document.getElementById('exportBtn').onclick=()=>{
  const r = buildExport();
  taJson.value=r.json; taList.value=r.list;
  modal.classList.add('show');
};
document.getElementById('mClose').onclick=()=>modal.classList.remove('show');
modal.onclick=e=>{ if(e.target===modal) modal.classList.remove('show'); };
document.getElementById('copyJson').onclick=()=>{ taJson.select(); document.execCommand('copy'); };
document.getElementById('copyList').onclick=()=>{ taList.select(); document.execCommand('copy'); };
document.getElementById('dlJson').onclick=()=>{
  const blob = new Blob([taJson.value],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '未分类_标签结果.json';
  a.click();
};
document.getElementById('clearBtn').onclick=()=>{
  if(!confirm('确定清空全部标记（仅影响本页标签，不动图片文件）？')) return;
  tags={}; localStorage.removeItem(LSKEY);
  buildSections(); applyFilter();
};
searchEl.addEventListener('input',applyFilter);
ffilterEl.addEventListener('change',applyFilter);
buildSections();
applyFilter();
</script>
